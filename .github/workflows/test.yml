name: registry-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jade_test
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: ci-disposable-database-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d jade_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JADE_TEST_DATABASE_URL: postgresql+psycopg://test_runner:ci-disposable-database-only@localhost:5432/jade_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-postgres.txt
      - run: python -m pytest -q --junitxml=test-results/junit.xml
      - run: node --check app/static/app.js
